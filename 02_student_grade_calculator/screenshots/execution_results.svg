<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="618" viewBox="0 0 1200 618"><rect width="1200" height="618" fill="#141820"/><rect x="12" y="12" width="1176" height="38" rx="8" fill="#272e3a"/><circle cx="29" cy="31" r="5" fill="#ff5f56"/><circle cx="47" cy="31" r="5" fill="#ffbd2e"/><circle cx="65" cy="31" r="5" fill="#27c93f"/><text x="84" y="36" fill="#f0f3f8" font-family="monospace" font-size="15" font-weight="bold">02 - Student Marks and Grade Calculator</text><g font-family="monospace" font-size="14"><text x="24" y="60" fill="#e0e4ea">02 - Student Marks and Grade Calculator</text><text x="24" y="81" fill="#e0e4ea">Captured program output — Python 3.13.5</text><text x="24" y="102" fill="#e0e4ea"></text><text x="24" y="123" fill="#74cfff">CASE: Grade A</text><text x="24" y="144" fill="#e0e4ea">$ python main.py</text><text x="24" y="165" fill="#e0e4ea">Enter marks for subject 1 (0-100): 95</text><text x="24" y="186" fill="#e0e4ea">Enter marks for subject 2 (0-100): 85</text><text x="24" y="207" fill="#e0e4ea">Enter marks for subject 3 (0-100): 90</text><text x="24" y="228" fill="#e0e4ea">Average: 90.0</text><text x="24" y="249" fill="#e0e4ea">Grade: A</text><text x="24" y="270" fill="#e0e4ea"></text><text x="24" y="291" fill="#74cfff">CASE: Grade C</text><text x="24" y="312" fill="#e0e4ea">$ python main.py</text><text x="24" y="333" fill="#e0e4ea">Enter marks for subject 1 (0-100): 75</text><text x="24" y="354" fill="#e0e4ea">Enter marks for subject 2 (0-100): 70</text><text x="24" y="375" fill="#e0e4ea">Enter marks for subject 3 (0-100): 80</text><text x="24" y="396" fill="#e0e4ea">Average: 75.0</text><text x="24" y="417" fill="#e0e4ea">Grade: C</text><text x="24" y="438" fill="#e0e4ea"></text><text x="24" y="459" fill="#74cfff">CASE: Invalid marks</text><text x="24" y="480" fill="#e0e4ea">$ python main.py</text><text x="24" y="501" fill="#e0e4ea">Enter marks for subject 1 (0-100): 110</text><text x="24" y="522" fill="#e0e4ea">Enter marks for subject 2 (0-100): 80</text><text x="24" y="543" fill="#e0e4ea">Enter marks for subject 3 (0-100): 70</text><text x="24" y="564" fill="#e0e4ea">Invalid marks</text><text x="24" y="585" fill="#e0e4ea"></text></g></svg>