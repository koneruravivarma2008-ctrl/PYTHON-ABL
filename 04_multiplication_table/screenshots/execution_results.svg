<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1017" viewBox="0 0 1200 1017"><rect width="1200" height="1017" fill="#141820"/><rect x="12" y="12" width="1176" height="38" rx="8" fill="#272e3a"/><circle cx="29" cy="31" r="5" fill="#ff5f56"/><circle cx="47" cy="31" r="5" fill="#ffbd2e"/><circle cx="65" cy="31" r="5" fill="#27c93f"/><text x="84" y="36" fill="#f0f3f8" font-family="monospace" font-size="15" font-weight="bold">04 - Multiplication Table Generator</text><g font-family="monospace" font-size="14"><text x="24" y="60" fill="#e0e4ea">04 - Multiplication Table Generator</text><text x="24" y="81" fill="#e0e4ea">Captured program output — Python 3.13.5</text><text x="24" y="102" fill="#e0e4ea"></text><text x="24" y="123" fill="#74cfff">CASE: Positive number</text><text x="24" y="144" fill="#e0e4ea">$ python main.py</text><text x="24" y="165" fill="#e0e4ea">Enter a number: 5</text><text x="24" y="186" fill="#e0e4ea">5 x 1 = 5</text><text x="24" y="207" fill="#e0e4ea">5 x 2 = 10</text><text x="24" y="228" fill="#e0e4ea">5 x 3 = 15</text><text x="24" y="249" fill="#e0e4ea">5 x 4 = 20</text><text x="24" y="270" fill="#e0e4ea">5 x 5 = 25</text><text x="24" y="291" fill="#e0e4ea">5 x 6 = 30</text><text x="24" y="312" fill="#e0e4ea">5 x 7 = 35</text><text x="24" y="333" fill="#e0e4ea">5 x 8 = 40</text><text x="24" y="354" fill="#e0e4ea">5 x 9 = 45</text><text x="24" y="375" fill="#e0e4ea">5 x 10 = 50</text><text x="24" y="396" fill="#e0e4ea"></text><text x="24" y="417" fill="#74cfff">CASE: Zero</text><text x="24" y="438" fill="#e0e4ea">$ python main.py</text><text x="24" y="459" fill="#e0e4ea">Enter a number: 0</text><text x="24" y="480" fill="#e0e4ea">0 x 1 = 0</text><text x="24" y="501" fill="#e0e4ea">0 x 2 = 0</text><text x="24" y="522" fill="#e0e4ea">0 x 3 = 0</text><text x="24" y="543" fill="#e0e4ea">0 x 4 = 0</text><text x="24" y="564" fill="#e0e4ea">0 x 5 = 0</text><text x="24" y="585" fill="#e0e4ea">0 x 6 = 0</text><text x="24" y="606" fill="#e0e4ea">0 x 7 = 0</text><text x="24" y="627" fill="#e0e4ea">0 x 8 = 0</text><text x="24" y="648" fill="#e0e4ea">0 x 9 = 0</text><text x="24" y="669" fill="#e0e4ea">0 x 10 = 0</text><text x="24" y="690" fill="#e0e4ea"></text><text x="24" y="711" fill="#74cfff">CASE: Negative number</text><text x="24" y="732" fill="#e0e4ea">$ python main.py</text><text x="24" y="753" fill="#e0e4ea">Enter a number: -3</text><text x="24" y="774" fill="#e0e4ea">-3 x 1 = -3</text><text x="24" y="795" fill="#e0e4ea">-3 x 2 = -6</text><text x="24" y="816" fill="#e0e4ea">-3 x 3 = -9</text><text x="24" y="837" fill="#e0e4ea">-3 x 4 = -12</text><text x="24" y="858" fill="#e0e4ea">-3 x 5 = -15</text><text x="24" y="879" fill="#e0e4ea">-3 x 6 = -18</text><text x="24" y="900" fill="#e0e4ea">-3 x 7 = -21</text><text x="24" y="921" fill="#e0e4ea">-3 x 8 = -24</text><text x="24" y="942" fill="#e0e4ea">-3 x 9 = -27</text><text x="24" y="963" fill="#e0e4ea">-3 x 10 = -30</text><text x="24" y="984" fill="#e0e4ea"></text></g></svg>