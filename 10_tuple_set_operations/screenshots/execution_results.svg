<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="891" viewBox="0 0 1200 891"><rect width="1200" height="891" fill="#141820"/><rect x="12" y="12" width="1176" height="38" rx="8" fill="#272e3a"/><circle cx="29" cy="31" r="5" fill="#ff5f56"/><circle cx="47" cy="31" r="5" fill="#ffbd2e"/><circle cx="65" cy="31" r="5" fill="#27c93f"/><text x="84" y="36" fill="#f0f3f8" font-family="monospace" font-size="15" font-weight="bold">10 - Tuple and Set Operations</text><g font-family="monospace" font-size="14"><text x="24" y="60" fill="#e0e4ea">10 - Tuple and Set Operations</text><text x="24" y="81" fill="#e0e4ea">Captured program output — Python 3.13.5</text><text x="24" y="102" fill="#e0e4ea"></text><text x="24" y="123" fill="#74cfff">CASE: Overlapping sets</text><text x="24" y="144" fill="#e0e4ea">$ python main.py</text><text x="24" y="165" fill="#e0e4ea">Enter set A values separated by spaces: 1 2 3</text><text x="24" y="186" fill="#e0e4ea">Enter set B values separated by spaces: 3 4 5</text><text x="24" y="207" fill="#e0e4ea">Enter a value to search in set A: 2</text><text x="24" y="228" fill="#e0e4ea">Tuple: (&apos;Ravi&apos;, 18, &apos;CSE&apos;)</text><text x="24" y="249" fill="#e0e4ea">Unpacked: Ravi 18 CSE</text><text x="24" y="270" fill="#e0e4ea">Union: {1, 2, 3, 4, 5}</text><text x="24" y="291" fill="#e0e4ea">Intersection: {3}</text><text x="24" y="312" fill="#e0e4ea">A - B: {1, 2}</text><text x="24" y="333" fill="#e0e4ea">Present in A: True</text><text x="24" y="354" fill="#e0e4ea"></text><text x="24" y="375" fill="#74cfff">CASE: Disjoint sets</text><text x="24" y="396" fill="#e0e4ea">$ python main.py</text><text x="24" y="417" fill="#e0e4ea">Enter set A values separated by spaces: 1 2</text><text x="24" y="438" fill="#e0e4ea">Enter set B values separated by spaces: 4 5</text><text x="24" y="459" fill="#e0e4ea">Enter a value to search in set A: 9</text><text x="24" y="480" fill="#e0e4ea">Tuple: (&apos;Ravi&apos;, 18, &apos;CSE&apos;)</text><text x="24" y="501" fill="#e0e4ea">Unpacked: Ravi 18 CSE</text><text x="24" y="522" fill="#e0e4ea">Union: {1, 2, 4, 5}</text><text x="24" y="543" fill="#e0e4ea">Intersection: set()</text><text x="24" y="564" fill="#e0e4ea">A - B: {1, 2}</text><text x="24" y="585" fill="#e0e4ea">Present in A: False</text><text x="24" y="606" fill="#e0e4ea"></text><text x="24" y="627" fill="#74cfff">CASE: Duplicates in inputs</text><text x="24" y="648" fill="#e0e4ea">$ python main.py</text><text x="24" y="669" fill="#e0e4ea">Enter set A values separated by spaces: 1 1 2</text><text x="24" y="690" fill="#e0e4ea">Enter set B values separated by spaces: 2 2 3</text><text x="24" y="711" fill="#e0e4ea">Enter a value to search in set A: 3</text><text x="24" y="732" fill="#e0e4ea">Tuple: (&apos;Ravi&apos;, 18, &apos;CSE&apos;)</text><text x="24" y="753" fill="#e0e4ea">Unpacked: Ravi 18 CSE</text><text x="24" y="774" fill="#e0e4ea">Union: {1, 2, 3}</text><text x="24" y="795" fill="#e0e4ea">Intersection: {2}</text><text x="24" y="816" fill="#e0e4ea">A - B: {1}</text><text x="24" y="837" fill="#e0e4ea">Present in A: False</text><text x="24" y="858" fill="#e0e4ea"></text></g></svg>