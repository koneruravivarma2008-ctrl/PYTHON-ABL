<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="576" viewBox="0 0 1200 576"><rect width="1200" height="576" fill="#141820"/><rect x="12" y="12" width="1176" height="38" rx="8" fill="#272e3a"/><circle cx="29" cy="31" r="5" fill="#ff5f56"/><circle cx="47" cy="31" r="5" fill="#ffbd2e"/><circle cx="65" cy="31" r="5" fill="#27c93f"/><text x="84" y="36" fill="#f0f3f8" font-family="monospace" font-size="15" font-weight="bold">01 - Simple Calculator</text><g font-family="monospace" font-size="14"><text x="24" y="60" fill="#e0e4ea">01 - Simple Calculator</text><text x="24" y="81" fill="#e0e4ea">Captured program output — Python 3.13.5</text><text x="24" y="102" fill="#e0e4ea"></text><text x="24" y="123" fill="#74cfff">CASE: Addition</text><text x="24" y="144" fill="#e0e4ea">$ python main.py</text><text x="24" y="165" fill="#e0e4ea">Enter first number: 8</text><text x="24" y="186" fill="#e0e4ea">Enter second number: 2</text><text x="24" y="207" fill="#e0e4ea">Enter operator (+, -, *, /): +</text><text x="24" y="228" fill="#e0e4ea">Result: 10.0</text><text x="24" y="249" fill="#e0e4ea"></text><text x="24" y="270" fill="#74cfff">CASE: Division by zero</text><text x="24" y="291" fill="#e0e4ea">$ python main.py</text><text x="24" y="312" fill="#e0e4ea">Enter first number: 8</text><text x="24" y="333" fill="#e0e4ea">Enter second number: 0</text><text x="24" y="354" fill="#e0e4ea">Enter operator (+, -, *, /): /</text><text x="24" y="375" fill="#e0e4ea">Error: division by zero</text><text x="24" y="396" fill="#e0e4ea"></text><text x="24" y="417" fill="#74cfff">CASE: Invalid operator</text><text x="24" y="438" fill="#e0e4ea">$ python main.py</text><text x="24" y="459" fill="#e0e4ea">Enter first number: 8</text><text x="24" y="480" fill="#e0e4ea">Enter second number: 2</text><text x="24" y="501" fill="#e0e4ea">Enter operator (+, -, *, /): %</text><text x="24" y="522" fill="#e0e4ea">Invalid operator</text><text x="24" y="543" fill="#e0e4ea"></text></g></svg>