<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450"><rect width="1200" height="450" fill="#141820"/><rect x="12" y="12" width="1176" height="38" rx="8" fill="#272e3a"/><circle cx="29" cy="31" r="5" fill="#ff5f56"/><circle cx="47" cy="31" r="5" fill="#ffbd2e"/><circle cx="65" cy="31" r="5" fill="#27c93f"/><text x="84" y="36" fill="#f0f3f8" font-family="monospace" font-size="15" font-weight="bold">03 - Leap Year Checker</text><g font-family="monospace" font-size="14"><text x="24" y="60" fill="#e0e4ea">03 - Leap Year Checker</text><text x="24" y="81" fill="#e0e4ea">Captured program output — Python 3.13.5</text><text x="24" y="102" fill="#e0e4ea"></text><text x="24" y="123" fill="#74cfff">CASE: Leap year</text><text x="24" y="144" fill="#e0e4ea">$ python main.py</text><text x="24" y="165" fill="#e0e4ea">Enter a year: 2024</text><text x="24" y="186" fill="#e0e4ea">2024 is a leap year</text><text x="24" y="207" fill="#e0e4ea"></text><text x="24" y="228" fill="#74cfff">CASE: Century non-leap year</text><text x="24" y="249" fill="#e0e4ea">$ python main.py</text><text x="24" y="270" fill="#e0e4ea">Enter a year: 1900</text><text x="24" y="291" fill="#e0e4ea">1900 is not a leap year</text><text x="24" y="312" fill="#e0e4ea"></text><text x="24" y="333" fill="#74cfff">CASE: 400-year leap year</text><text x="24" y="354" fill="#e0e4ea">$ python main.py</text><text x="24" y="375" fill="#e0e4ea">Enter a year: 2000</text><text x="24" y="396" fill="#e0e4ea">2000 is a leap year</text><text x="24" y="417" fill="#e0e4ea"></text></g></svg>