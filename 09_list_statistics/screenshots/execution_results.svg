<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="618" viewBox="0 0 1200 618"><rect width="1200" height="618" fill="#141820"/><rect x="12" y="12" width="1176" height="38" rx="8" fill="#272e3a"/><circle cx="29" cy="31" r="5" fill="#ff5f56"/><circle cx="47" cy="31" r="5" fill="#ffbd2e"/><circle cx="65" cy="31" r="5" fill="#27c93f"/><text x="84" y="36" fill="#f0f3f8" font-family="monospace" font-size="15" font-weight="bold">09 - List Operations and Statistics</text><g font-family="monospace" font-size="14"><text x="24" y="60" fill="#e0e4ea">09 - List Operations and Statistics</text><text x="24" y="81" fill="#e0e4ea">Captured program output — Python 3.13.5</text><text x="24" y="102" fill="#e0e4ea"></text><text x="24" y="123" fill="#74cfff">CASE: Positive integers</text><text x="24" y="144" fill="#e0e4ea">$ python main.py</text><text x="24" y="165" fill="#e0e4ea">Enter integers separated by spaces: 4 2 8 6</text><text x="24" y="186" fill="#e0e4ea">List: [4, 2, 8, 6]</text><text x="24" y="207" fill="#e0e4ea">Sum: 20</text><text x="24" y="228" fill="#e0e4ea">Average: 5.0</text><text x="24" y="249" fill="#e0e4ea">Minimum: 2</text><text x="24" y="270" fill="#e0e4ea">Maximum: 8</text><text x="24" y="291" fill="#e0e4ea"></text><text x="24" y="312" fill="#74cfff">CASE: Duplicate values</text><text x="24" y="333" fill="#e0e4ea">$ python main.py</text><text x="24" y="354" fill="#e0e4ea">Enter integers separated by spaces: 3 3 1 5</text><text x="24" y="375" fill="#e0e4ea">List: [3, 3, 1, 5]</text><text x="24" y="396" fill="#e0e4ea">Sum: 12</text><text x="24" y="417" fill="#e0e4ea">Average: 3.0</text><text x="24" y="438" fill="#e0e4ea">Minimum: 1</text><text x="24" y="459" fill="#e0e4ea">Maximum: 5</text><text x="24" y="480" fill="#e0e4ea"></text><text x="24" y="501" fill="#74cfff">CASE: Empty list</text><text x="24" y="522" fill="#e0e4ea">$ python main.py</text><text x="24" y="543" fill="#e0e4ea">Enter integers separated by spaces: </text><text x="24" y="564" fill="#e0e